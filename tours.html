<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tour Packages | Leo Tour & Events</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    /* VARIABLES & THEME */
    :root {
      --primary: #ff6b35;
      --primary-dark: #e55a2b;
      --success: #25d366;
      --dark: #0f172a;
      --light: #f1f5f9;
      --white: #ffffff;
      --text-muted: #64748b;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f8fafc; color: var(--dark); overflow-x: hidden; }
    h1, h2, h3 { font-family: 'Poppins', sans-serif; }

    /* HEADER */
    .header { position: fixed; width: 100%; top: 0; z-index: 1000; background: var(--dark); padding: 1rem 0; box-shadow: var(--shadow); }
    .navbar { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: auto; padding: 0 1.5rem; }
    .logo { color: white; font-weight: 800; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; }

    /* CATEGORY NAV */
    .filter-bar { position: sticky; top: 68px; z-index: 999; background: white; border-bottom: 1px solid #e2e8f0; padding: 1rem 0; }
    .filter-container { display: flex; gap: 0.8rem; overflow-x: auto; white-space: nowrap; scrollbar-width: none; padding-bottom: 5px; }
    .filter-container::-webkit-scrollbar { display: none; }
    .filter-btn { padding: 0.6rem 1.4rem; border-radius: 50px; border: 1px solid #e2e8f0; background: white; font-weight: 500; cursor: pointer; transition: 0.3s; font-size: 0.85rem; }
    .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

    /* TOUR CARDS */
    .tour-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2rem; padding: 3rem 0; }
    .tour-card { background: white; border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); transition: 0.4s; display: none; border: 1px solid #f1f5f9; }
    .tour-card.show { display: block; animation: zoomIn 0.4s ease forwards; }
    @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    
    .tour-card:hover { transform: translateY(-10px); }
    .card-img { height: 230px; position: relative; }
    .card-img img { width: 100%; height: 100%; object-fit: cover; }
    .card-tag { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.6); color: white; padding: 4px 12px; border-radius: 50px; font-size: 0.7rem; backdrop-filter: blur(5px); }
    
    .card-body { padding: 1.5rem; }
    .card-body h3 { font-size: 1.25rem; margin-bottom: 0.5rem; }
    .card-body p { font-size: 0.9rem; color: var(--text-muted); min-height: 45px; }
    
    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #f1f5f9; }
    .price-tag { font-weight: 800; color: var(--primary); font-size: 1.1rem; }
    .btn-view { background: var(--dark); color: white; padding: 0.5rem 1.2rem; border-radius: 8px; font-size: 0.85rem; cursor: pointer; border: none; font-weight: 600; }

    /* MODERN MODAL */
    .modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); z-index: 2000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
    .modal-content { background: white; width: 95%; max-width: 700px; border-radius: 24px; position: relative; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
    .modal-header { padding: 2rem; border-bottom: 1px solid #f1f5f9; }
    .modal-body { padding: 2rem; }
    .close-modal { position: absolute; top: 20px; right: 20px; font-size: 1.8rem; cursor: pointer; color: var(--text-muted); }

    /* QUOTE FORM */
    .quote-form { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; background: var(--light); padding: 1.5rem; border-radius: 16px; margin: 1.5rem 0; }
    .input-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .input-group label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
    .input-group select, .input-group input { padding: 0.8rem; border-radius: 10px; border: 1px solid #cbd5e1; font-family: inherit; }

    .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .btn-download { border: 2px solid var(--dark); background: transparent; color: var(--dark); font-weight: 700; padding: 1rem; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-whatsapp { background: var(--success); color: white; font-weight: 700; padding: 1rem; border-radius: 12px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    
    .container { max-width: 1200px; margin: auto; padding: 0 1.5rem; }

    @media (max-width: 600px) {
      .quote-form, .action-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="navbar">
      <div class="logo">LEO TOUR & EVENTS</div>
    </div>
  </header>

  <div class="filter-bar">
    <div class="container">
      <div class="filter-container">
        <button class="filter-btn active" onclick="filterTours('all', this)">All Packages</button>
        <button class="filter-btn" onclick="filterTours('international', this)">International</button>
        <button class="filter-btn" onclick="filterTours('honeymoon', this)">Honeymoon</button>
        <button class="filter-btn" onclick="filterTours('spiritual', this)">Spiritual/Pilgrim</button>
        <button class="filter-btn" onclick="filterTours('adventure', this)">Adventure/Expedition</button>
        <button class="filter-btn" onclick="filterTours('medical', this)">Medical/Ayurveda</button>
        <button class="filter-btn" onclick="filterTours('wildlife', this)">Wildlife Safaris</button>
      </div>
    </div>
  </div>

  <section class="container">
    <div class="tour-grid" id="tourGrid">
      </div>
  </section>

  <div class="modal" id="tourModal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal()">&times;</span>
      
      <div class="modal-header">
        <h2 id="mTitle">Package Name</h2>
        <p id="mRoute" style="color:var(--text-muted); font-size: 0.9rem; margin-top: 5px;"></p>
      </div>

      <div class="modal-body">
        <h4>Customize Your Trip</h4>
        <div class="quote-form">
          <div class="input-group">
            <label>Travel Date</label>
            <input type="date" id="qDate">
          </div>
          <div class="input-group">
            <label>No. of Travelers</label>
            <select id="qPax">
              <option>1 Adult</option>
              <option selected>2 Adults (Couple)</option>
              <option>3-5 (Small Family)</option>
              <option>5-10 (Group)</option>
              <option>Large Group (10+)</option>
            </select>
          </div>
          <div class="input-group">
            <label>Duration</label>
            <select id="qDays">
              <option>3 Days / 2 Nights</option>
              <option selected>5 Days / 4 Nights</option>
              <option>7 Days / 6 Nights</option>
              <option>Custom/Long Trip</option>
            </select>
          </div>
          <div class="input-group">
            <label>Stay Preference</label>
            <select id="qStay">
              <option>Budget/Standard</option>
              <option selected>3-Star Comfort</option>
              <option>4-Star / 5-Star Luxury</option>
            </select>
          </div>
        </div>

        <div class="action-row">
          <button class="btn-download" onclick="downloadPdf()">
            <span>📄</span> Download Itinerary
          </button>
          <button class="btn-whatsapp" onclick="sendInquiry()">
            <span>💬</span> Get Best Quote
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // DATA SOURCE (Ref: Handwritten Notes & Previous context)
    const tours = [
      { id: 1, cat: 'international', title: 'Europe Essence', route: 'Paris - Switzerland - Amsterdam', desc: 'Experience the romantic streets of Paris and alpine beauty.', file: 'europe.pdf', img: 'https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=600' },
      { id: 2, cat: 'honeymoon', title: 'Bali & Vietnam', route: 'Ubud - Seminyak - Ha Long Bay', desc: 'Perfect tropical escape for newly weds with private villas.', file: 'bali.pdf', img: 'https://images.unsplash.com/photo-1537996194471-e657df975ab4?w=600' },
      { id: 3, cat: 'spiritual', title: 'Chardham Yatra', route: 'Yamunotri - Gangotri - Kedarnath - Badrinath', desc: 'The most sacred pilgrimage of North India.', file: 'chardham.pdf', img: 'https://images.unsplash.com/photo-1626621341517-bbf3d9990a23?w=600' },
      { id: 4, cat: 'adventure', title: 'Ladakh Bike Expedition', route: 'Leh - Khardung La - Nubra - Pangong', desc: 'Unleash the adventurer in you on the highest motorable roads.', file: 'ladakh.pdf', img: 'https://images.unsplash.com/photo-1581791534721-e599df4417f7?w=600' },
      { id: 5, cat: 'wildlife', title: 'Royal Bengal Safari', route: 'Jim Corbett - Ranthambore - Kaziranga', desc: 'Spot tigers and one-horned rhinos in their natural habitat.', file: 'wildlife.pdf', img: 'https://images.unsplash.com/photo-1547471080-7cc2caa01a7e?w=600' },
      { id: 6, cat: 'medical', title: 'Kerala Ayurveda Healing', route: 'Cochin - Kottakkal - Alleppey', desc: 'Traditional healing treatments for rejuvenation.', file: 'ayurveda.pdf', img: 'https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?w=600' }
    ];

    let currentTour = null;

    function renderTours() {
      const grid = document.getElementById('tourGrid');
      grid.innerHTML = tours.map(t => `
        <div class="tour-card show" data-cat="${t.cat}">
          <div class="card-img">
            <span class="card-tag">${t.cat.toUpperCase()}</span>
            <img src="${t.img}" alt="${t.title}">
          </div>
          <div class="card-body">
            <h3>${t.title}</h3>
            <p>${t.desc}</p>
            <div class="card-footer">
              <span class="price-tag">Best Price</span>
              <button class="btn-view" onclick="openModal(${t.id})">View Details</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterTours(cat, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      const cards = document.querySelectorAll('.tour-card');
      cards.forEach(c => {
        if(cat === 'all' || c.getAttribute('data-cat') === cat) {
          c.classList.add('show');
        } else {
          c.classList.remove('show');
        }
      });
    }

    function openModal(id) {
      currentTour = tours.find(t => t.id === id);
      document.getElementById('mTitle').innerText = currentTour.title;
      document.getElementById('mRoute').innerText = `Coverage: ${currentTour.route}`;
      document.getElementById('tourModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('tourModal').style.display = 'none';
    }

    function downloadPdf() {
      // For a real static site, put your PDFs in a folder named 'itineraries'
      // Example: window.location.href = '/itineraries/' + currentTour.file;
      alert('Your download for "' + currentTour.file + '" will start. (Link the file path in the code to your actual PDF)');
    }

    function sendInquiry() {
      const date = document.getElementById('qDate').value || 'TBD';
      const pax = document.getElementById('qPax').value;
      const days = document.getElementById('qDays').value;
      const stay = document.getElementById('qStay').value;

      const message = `Hello Leo Tours! 👋 %0A%0A` +
        `*Package Inquiry:* ${currentTour.title} %0A` +
        `*Route:* ${currentTour.route} %0A` +
        `--------------------------- %0A` +
        `*Travel Date:* ${date} %0A` +
        `*Travelers:* ${pax} %0A` +
        `*Duration:* ${days} %0A` +
        `*Hotel Class:* ${stay} %0A` +
        `--------------------------- %0A` +
        `Please share the final price and booking availability.`;

      window.open(`https://wa.me/91XXXXXXXXXX?text=${message}`, '_blank');
    }

    window.onclick = (e) => { if(e.target.className === 'modal') closeModal(); };
    renderTours();
  </script>
</body>
</html>
